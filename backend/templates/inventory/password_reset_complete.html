{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contraseña actualizada</title>
  <link rel="stylesheet" href="{% static 'inventory/login.css' %}?v={{ app_version }}">
</head>
<body>
  <main class="login-shell compact">
    <section class="login-panel" aria-label="Contraseña actualizada">
      <div class="brand-lockup">
        <img class="login-corporate-logo" src="{% static 'inventory/login-agfa-healthcare.png' %}?v={{ app_version }}" alt="AGFA HealthCare">
      </div>
      <div class="login-card status-card">
        <p class="eyebrow">Acceso actualizado</p>
        <h1>Contraseña restablecida</h1>
        <p class="intro">Tu contraseña fue actualizada correctamente. Ya puedes ingresar a la plataforma.</p>
        <a class="primary-link" href="{% url 'login' %}">Ingresar al monitor</a>
      </div>
      <footer class="login-footer">
        <span>AGFA HealthCare - development by ehzfk - version {{ app_version }} - {{ app_year }}</span>
      </footer>
    </section>
  </main>
</body>
</html>
